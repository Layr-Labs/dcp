name: Checker tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checkers:
    uses: Layr-Labs/llm-verifier/.github/workflows/test-checkers.yml@204fdf8fb640704da0a3972d97831de09bfb1c7a
    with:
      verifier_repository: Layr-Labs/llm-verifier
      verifier_revision: 204fdf8fb640704da0a3972d97831de09bfb1c7a
      root_dir: '.'
    secrets:
      VERIFIER_CHECKOUT_TOKEN: ${{ secrets.VERIFIER_CHECKOUT_TOKEN }}

  producer:
    name: Offline DCP admission and producer tests
    needs: [checkers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: llmv-checker-package
          path: ${{ runner.temp }}/checker-package/
      - name: Restore exact tested source and verifier wheel
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/producer-env"
          "$RUNNER_TEMP/producer-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/checker-package/wheel/*.whl
          mkdir "$RUNNER_TEMP/challenge"
          tar -xf "$RUNNER_TEMP/checker-package/challenge.tar" -C "$RUNNER_TEMP/challenge"
          cd "$RUNNER_TEMP/challenge"
          env -i PATH="$PATH" "$RUNNER_TEMP/producer-env/bin/python" -m unittest -v
