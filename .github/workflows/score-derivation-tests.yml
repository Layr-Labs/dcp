name: Score derivation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  derivation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: challenge
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Layr-Labs/llm-verifier
          ref: da594aad5166918d4dd7d71630e1e649521e1953
          token: ${{ secrets.VERIFIER_CHECKOUT_TOKEN || github.token }}
          path: verifier
          persist-credentials: false
      - name: Install pinned derivation wheel and check the adapter offline
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/derivation-env"
          "$RUNNER_TEMP/derivation-env/bin/python" -m pip wheel --no-deps ./verifier --wheel-dir "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/derivation-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/wheel/*.whl
          cd challenge
          env -i PATH="$PATH" "$RUNNER_TEMP/derivation-env/bin/python" -m unittest test_score_derivation test_derivation_integration -v
          if test -f score-derivation-profile.json; then
            env -i PATH="$PATH" "$RUNNER_TEMP/derivation-env/bin/python" tools/derivation_profile.py --check
          fi
